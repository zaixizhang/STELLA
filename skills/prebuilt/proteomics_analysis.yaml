skill_id: proteomics_analysis
version: "1.0.0"
name: Quantitative Proteomics Analysis
domain: proteomics
description: "Analyzes quantitative proteomics experiments with peptide and protein quality control, normalization, differential abundance testing, and functional interpretation."

workflow:
  - step: 1
    action: inspect_proteomics_design
    description: "Validate sample annotations, acquisition mode, protein identifiers, missingness, and replicate structure."
    tools_required: ["create_and_run_script"]
    parameters:
      require_replicates: true
      report_missingness: true
    agent: dev

  - step: 2
    action: filter_and_normalize
    description: "Apply transparent contaminant filtering, protein-level aggregation, normalization, and missing-value handling."
    tools_required: ["create_and_run_script"]
    parameters:
      avoid_default_imputation: true
      record_filtering: true
    agent: dev

  - step: 3
    action: test_differential_abundance
    description: "Fit design-aware models for differential protein abundance and control multiple testing."
    tools_required: ["create_and_run_script"]
    parameters:
      include_covariates: true
      control_fdr: true
    agent: dev

  - step: 4
    action: interpret_protein_changes
    description: "Perform pathway, complex, and interaction-level interpretation while preserving effect sizes and uncertainty."
    tools_required: ["create_and_run_script", "multi_source_search", "query_pubmed"]
    parameters:
      report_background_set: true
      retain_effect_sizes: true
    agent: dev

  - step: 5
    action: audit_proteomics_results
    description: "Check identifier mapping, normalization sensitivity, missingness bias, and concordance across replicates."
    tools_required: []
    parameters:
      require_sensitivity_check: true
    agent: critic

tools_required:
  - tool_id: create_and_run_script
    version: ">=1.0.0"
    optional: false
  - tool_id: multi_source_search
    version: ">=1.0.0"
    optional: true
  - tool_id: query_pubmed
    version: ">=1.0.0"
    optional: true

tags:
  - "proteomics"
  - "mass spectrometry"
  - "protein abundance"
  - "differential proteins"
  - "pathway analysis"

applicable_queries:
  - "*proteomic*analysis*"
  - "*mass*spectrometry*data*"
  - "*differential*protein*"
  - "*protein*abundance*"

quality_metrics:
  success_count: 0
  failure_count: 0
  avg_completion_time_sec: 0.0
  avg_critic_score: 0.0
  last_used: ""
  created_at: "2026-08-06"
  last_updated: "2026-08-06"

