skill_id: genomic_variant_interpretation
version: "1.0.0"
name: Genomic Variant Interpretation
domain: clinical_genomics
description: "Interprets germline or somatic genomic variants through normalization, evidence aggregation, phenotype-aware classification, and explicit uncertainty reporting."

workflow:
  - step: 1
    action: normalize_and_validate_variants
    description: "Normalize genome build, coordinates, alleles, and transcript identifiers; reject malformed or ambiguous records."
    tools_required: ["create_and_run_script"]
    parameters:
      require_genome_build: true
      split_multiallelic: true
    agent: dev

  - step: 2
    action: aggregate_variant_evidence
    description: "Collect population, functional, disease, and literature evidence for each normalized variant."
    tools_required: ["multi_source_search", "query_pubmed"]
    parameters:
      include_population_frequency: true
      include_functional_evidence: true
    agent: dev

  - step: 3
    action: integrate_phenotype_context
    description: "Relate candidate variants to the supplied phenotype, inheritance model, tumor type, or treatment context."
    tools_required: ["create_and_run_script"]
    parameters:
      phenotype_aware: true
      report_conflicts: true
    agent: dev

  - step: 4
    action: classify_and_prioritize
    description: "Assign evidence-based classifications and rank variants while keeping supporting and contradicting evidence separate."
    tools_required: []
    parameters:
      include_uncertainty: true
      avoid_unsupported_causality: true
    agent: manager

  - step: 5
    action: audit_interpretation
    description: "Check transcript consistency, evidence provenance, classification logic, and clinical-actionability caveats."
    tools_required: []
    parameters:
      require_source_traceability: true
    agent: critic

tools_required:
  - tool_id: create_and_run_script
    version: ">=1.0.0"
    optional: false
  - tool_id: multi_source_search
    version: ">=1.0.0"
    optional: true
  - tool_id: query_pubmed
    version: ">=1.0.0"
    optional: true

tags:
  - "genomic variants"
  - "clinical genomics"
  - "precision medicine"
  - "variant annotation"
  - "pathogenicity"

applicable_queries:
  - "*interpret*variant*"
  - "*pathogenic*mutation*"
  - "*clinical*genomic*"
  - "*somatic*variant*"

