skill_id: pathway_enrichment_analysis
version: "1.0.0"
name: Pathway Enrichment Analysis
domain: functional_genomics
description: "Performs over-representation or ranked-list enrichment with identifier validation, explicit background selection, redundancy reduction, and evidence-aware interpretation."

workflow:
  - step: 1
    action: validate_gene_identifiers
    description: "Normalize identifiers, species, directionality, rankings, and duplicates; report unmapped entries."
    tools_required: ["create_and_run_script"]
    parameters:
      require_species: true
      report_mapping_rate: true
    agent: dev

  - step: 2
    action: define_test_and_background
    description: "Select over-representation or ranked enrichment and define an experiment-appropriate background universe."
    tools_required: ["create_and_run_script"]
    parameters:
      require_explicit_background: true
      avoid_arbitrary_cutoffs: true
    agent: dev

  - step: 3
    action: compute_enrichment
    description: "Run enrichment with multiple-testing correction and retain gene-level contributors, effect direction, and set size."
    tools_required: ["create_and_run_script"]
    parameters:
      control_fdr: true
      retain_leading_edge: true
    agent: dev

  - step: 4
    action: reduce_and_interpret_terms
    description: "Group redundant pathways and synthesize stable biological themes with supporting literature where needed."
    tools_required: ["multi_source_search", "query_pubmed"]
    parameters:
      cluster_redundant_terms: true
      avoid_single_term_claims: true
    agent: manager

  - step: 5
    action: audit_enrichment
    description: "Check identifier bias, background choice, database version, redundancy, and robustness to thresholds."
    tools_required: []
    parameters:
      require_background_check: true
    agent: critic

tools_required:
  - tool_id: create_and_run_script
    version: ">=1.0.0"
    optional: false
  - tool_id: multi_source_search
    version: ">=1.0.0"
    optional: true
  - tool_id: query_pubmed
    version: ">=1.0.0"
    optional: true

tags:
  - "pathway enrichment"
  - "gene set enrichment"
  - "GSEA"
  - "functional analysis"
  - "gene ontology"

applicable_queries:
  - "*pathway*enrichment*"
  - "*gene*set*analysis*"
  - "*GSEA*"
  - "*functional*enrichment*"

