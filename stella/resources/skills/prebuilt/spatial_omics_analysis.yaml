skill_id: spatial_omics_analysis
version: "1.0.0"
name: Spatial Omics Analysis
domain: spatial_omics
description: "Analyzes spatial transcriptomic or proteomic data while preserving tissue coordinates, detecting spatial domains, and quantifying cell-neighborhood relationships."

workflow:
  - step: 1
    action: validate_spatial_inputs
    description: "Validate expression, coordinate, image, and metadata alignment; flag missing spots or coordinate mismatches."
    tools_required: ["create_and_run_script"]
    parameters:
      preserve_coordinates: true
      check_image_alignment: true
    agent: dev

  - step: 2
    action: normalize_and_map_quality
    description: "Normalize measurements and map quality metrics across tissue to identify spatially structured artifacts."
    tools_required: ["create_and_run_script"]
    parameters:
      spatial_qc: true
      record_parameters: true
    agent: dev

  - step: 3
    action: identify_spatial_domains
    description: "Detect spatially coherent domains and spatially variable features across reasonable neighborhood scales."
    tools_required: ["create_and_run_script"]
    parameters:
      compare_neighbor_scales: true
      control_fdr: true
    agent: dev

  - step: 4
    action: analyze_cellular_neighborhoods
    description: "Estimate cell-type composition or labels and test enrichment, exclusion, and ligand-receptor hypotheses by neighborhood."
    tools_required: ["create_and_run_script", "multi_source_search"]
    parameters:
      test_against_null: true
      report_scale: true
    agent: dev

  - step: 5
    action: audit_spatial_conclusions
    description: "Check robustness to segmentation, resolution, neighborhood definition, and tissue-edge artifacts."
    tools_required: []
    parameters:
      require_sensitivity_analysis: true
    agent: critic

tools_required:
  - tool_id: create_and_run_script
    version: ">=1.0.0"
    optional: false
  - tool_id: multi_source_search
    version: ">=1.0.0"
    optional: true

tags:
  - "spatial omics"
  - "spatial transcriptomics"
  - "tissue domains"
  - "cell neighborhoods"
  - "spatial statistics"

applicable_queries:
  - "*spatial*transcriptomic*"
  - "*spatial*omics*"
  - "*tissue*domain*"
  - "*cell*neighborhood*"

