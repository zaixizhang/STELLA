skill_id: epigenomics_analysis
version: "1.0.0"
name: Epigenomics Analysis
domain: epigenomics
description: "Provides a reproducible workflow for chromatin accessibility, histone-mark, methylation, or related epigenomic assays from quality control to regulatory interpretation."

workflow:
  - step: 1
    action: inspect_assay_and_qc
    description: "Identify assay type, sample design, reference genome, and assay-specific quality metrics before analysis."
    tools_required: ["create_and_run_script", "run_shell_command"]
    parameters:
      require_sample_sheet: true
      report_qc_metrics: true
    agent: dev

  - step: 2
    action: process_and_quantify_signals
    description: "Perform assay-appropriate preprocessing and quantify peaks, regions, or methylation measurements with logged parameters."
    tools_required: ["create_and_run_script", "run_shell_command"]
    parameters:
      preserve_intermediate_qc: true
      record_reference_version: true
    agent: dev

  - step: 3
    action: annotate_regulatory_regions
    description: "Map signals to genes and regulatory annotations while retaining distance and ambiguity information."
    tools_required: ["create_and_run_script", "multi_source_search"]
    parameters:
      retain_many_to_many_links: true
    agent: dev

  - step: 4
    action: test_differential_regulation
    description: "Fit design-aware differential models and perform motif or pathway analysis with multiple-testing correction."
    tools_required: ["create_and_run_script"]
    parameters:
      use_design_covariates: true
      control_fdr: true
    agent: dev

  - step: 5
    action: audit_epigenomic_inference
    description: "Check replicate concordance, normalization assumptions, confounding, and limits of gene-regulatory attribution."
    tools_required: []
    parameters:
      require_replicate_concordance: true
    agent: critic

tools_required:
  - tool_id: create_and_run_script
    version: ">=1.0.0"
    optional: false
  - tool_id: run_shell_command
    version: ">=1.0.0"
    optional: true
  - tool_id: multi_source_search
    version: ">=1.0.0"
    optional: true

tags:
  - "epigenomics"
  - "ATAC-seq"
  - "ChIP-seq"
  - "DNA methylation"
  - "regulatory elements"

applicable_queries:
  - "*epigenomic*analysis*"
  - "*ATAC*seq*"
  - "*ChIP*seq*"
  - "*DNA*methylation*"

